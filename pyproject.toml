# ✱✱ pyproject.toml (добавьте/замените)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-bot"
version = "0.1.0"
description = "Telegram-бот для эко-геймификации"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.2",
  "SQLAlchemy>=2.0",
  "alembic>=1.16",
  "pydantic>=2.6"
]

[tool.setuptools.package-dir]      # ← говорит: «корнем пакетов будет src»
"" = "src"

[tool.setuptools.packages.find]    # ← автопоиск пакетов внутри src
where = ["src"]
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
